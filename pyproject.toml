[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamerv2"
version = "2.2.0"
description = "PEG: Planning Goals for Exploration (built on DreamerV2/LEXA)"
readme = "README.md"
license = { text = "MIT" }
# TF 2.4 ships wheels for cp36-cp38 only; uv can't provision 3.6, so 3.8.
requires-python = "==3.8.*"
dependencies = [
    "tensorflow==2.4.4",
    "tensorflow-probability==0.12.2",
    "numpy==1.19.5",
    "h5py==2.10.0",
    "protobuf==3.20.3",
    "gym==0.18.0",
    "ruamel.yaml==0.17.4",
    "cloudpickle==1.6.0",
    "matplotlib==3.3.4",
    "pandas==1.1.5",
    "scipy==1.5.4",
    "scikit-learn==0.24.2",
    "seaborn==0.11.2",
    "opencv-python==4.5.2.52",
    "imageio==2.9.0",
    "imageio-ffmpeg==0.4.7",
    "pillow==7.2.0",
    "tqdm",
    "ipdb",
    # Point Maze (mrl) imports torch; CPU build is enough.
    "torch==1.10.2",
]

[project.optional-dependencies]
# CUDA 11 / cuDNN 8 runtime libs for TF 2.4 on GPU (replaces conda cudatoolkit/cudnn).
# cuDNN >= 8.6 is needed for Ada (RTX 40xx) GPUs.
gpu = [
    "nvidia-cuda-runtime-cu11==11.8.89",
    "nvidia-cublas-cu11==11.11.3.6",
    "nvidia-cufft-cu11==10.9.0.58",
    "nvidia-curand-cu11==10.3.0.86",
    "nvidia-cusolver-cu11==11.4.1.48",
    "nvidia-cusparse-cu11==11.7.5.86",
    "nvidia-cudnn-cu11==8.6.0.163",
    "nvidia-cuda-nvcc-cu11==11.8.89",
]

[tool.setuptools]
packages = ["dreamerv2", "dreamerv2.common"]

[tool.setuptools.package-data]
dreamerv2 = ["configs.yaml"]

[tool.uv]
default-groups = []
# gym 0.18's setup.py has an invalid specifier ("opencv-python>=3.") that
# modern packaging (and uv) reject. third_party/wheels holds a wheel built from
# the unmodified 0.18.0 sdist with only that specifier changed to ">=3.0".

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
gym = { path = "third_party/wheels/gym-0.18.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
